<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话助手</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="newChat()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>新对话</span>
            </button>
        </div>
        <div class="sidebar-history" id="history-list"></div>
        <div class="sidebar-footer">
            <div class="footer-item" onclick="openSettings()" title="设置">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </div>
        </div>
    </aside>

    <main class="main-content" id="main-content">
        <!-- 顶部标题栏 -->
        <div class="main-header">
            <button class="mobile-menu-btn" onclick="toggleSidebar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <span class="page-title" id="page-title">AI 对话助手</span>
        </div>

        <!-- 欢迎页面（无对话时显示） -->
        <div class="welcome-screen" id="welcome-screen">
            <div class="welcome-logo">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="2"/>
                    <circle cx="17" cy="20" r="2" fill="currentColor"/>
                    <circle cx="31" cy="20" r="2" fill="currentColor"/>
                    <path d="M16 30c0 0 4 4 8 4s8-4 8-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="welcome-title">有什么我可以帮助你的？</h1>
            <p class="welcome-subtitle">选择以下功能快速开始，或直接输入你的问题</p>
            <div class="feature-cards">
                <div class="feature-card" onclick="sendExample('北京今天天气怎么样？')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v6m0 0l-3 3m3-3l3 3"/><path d="M20.3 18.9a8.5 8.5 0 1 1-12.6-12.6"/></svg>
                    <span>天气查询</span>
                </div>
                <div class="feature-card" onclick="sendExample('计算 23 * 45 + 128')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="10" y2="18"/><line x1="14" y1="18" x2="16" y2="18"/></svg>
                    <span>数学计算</span>
                </div>
                <div class="feature-card" onclick="sendExample('搜索最新的 AI 技术进展')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <span>智能搜索</span>
                </div>
                <div class="feature-card" onclick="sendExample('现在几点？今天是星期几？')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span>日期时间</span>
                </div>
            </div>
        </div>

        <!-- 对话区域 -->
        <div class="chat-container hidden" id="chat-container">
            <div class="chat-messages" id="chat-box">
                <!-- 消息由 JS 动态生成 -->
            </div>
            <!-- 滚动到底部指示器 -->
            <div class="scroll-indicator hidden" id="scroll-indicator" onclick="scrollToBottom()">
                <span>滚动到底部</span>
                <span class="arrow">↓</span>
            </div>
        </div>

        <!-- 底部输入区 -->
        <div class="input-area">
            <!-- 建议面板 -->
            <div class="suggestions" id="suggestions"></div>

            <div class="input-wrapper" id="input-wrapper">
                <!-- 附件按钮 -->
                <button class="attach-btn" id="attach-btn" onclick="triggerFileUpload()" title="上传文件">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <input type="file" id="file-input" class="hidden" accept="image/*,.pdf,.txt,.doc,.docx" onchange="handleFileSelected(event)">

                <textarea id="user-input" placeholder="输入消息，Enter 发送，Shift+Enter 换行..." rows="1"></textarea>

                <!-- 停止生成按钮（流式时显示） -->
                <button class="stop-btn hidden" id="stop-btn" onclick="stopGeneration()" title="停止生成">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                </button>

                <button class="send-btn" id="send-btn" onclick="sendMessage()" title="发送">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>

            <div class="input-meta">
                <span class="char-count" id="char-count"></span>
                <p class="input-hint">AI 助手可能会产生不准确的信息，请注意甄别。</p>
            </div>
        </div>
    </main>

    <!-- 移动端侧边栏遮罩 -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay hidden" id="settings-overlay" onclick="closeSettings()"></div>
    <div class="settings-modal hidden" id="settings-modal">
        <div class="settings-header">
            <h2>设置</h2>
            <button class="modal-close" onclick="closeSettings()" title="关闭">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="settings-body">
            <div class="settings-section">
                <label class="settings-label">AI 提供商</label>
                <select id="setting-provider" class="settings-input" onchange="onProviderChange()">
                    <option value="">-- 请选择 --</option>
                </select>
            </div>

            <div class="settings-section">
                <label class="settings-label">API Key</label>
                <input type="password" id="setting-api-key" class="settings-input" placeholder="输入你的 API Key">
            </div>

            <div class="settings-section">
                <label class="settings-label">API 地址 (Base URL)</label>
                <input type="text" id="setting-base-url" class="settings-input" placeholder="https://api.deepseek.com/v1">
            </div>

            <div class="settings-section">
                <label class="settings-label">模型</label>
                <select id="setting-model" class="settings-input">
                    <option value="">-- 请先选择提供商 --</option>
                </select>
            </div>

            <div class="settings-section hidden" id="custom-model-section">
                <label class="settings-label">自定义模型名称</label>
                <input type="text" id="setting-custom-model" class="settings-input" placeholder="请输入模型名称，如 gpt-4o">
            </div>

            <div class="settings-section">
                <label class="settings-label">搜索引擎</label>
                <select id="setting-search" class="settings-input">
                    <option value="bing">Bing 搜索</option>
                    <option value="duckduckgo">DuckDuckGo（需翻墙）</option>
                </select>
            </div>

            <div class="settings-section">
                <div class="settings-info" id="settings-info">
                    选择 AI 提供商后，将显示工具调用支持状态。
                </div>
            </div>
        </div>
        <div class="settings-footer">
            <button class="btn-cancel" onclick="closeSettings()">取消</button>
            <button class="btn-save" onclick="saveSettings()">保存设置</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
